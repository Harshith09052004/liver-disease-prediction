{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <title>Login</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap -->
    <link href="//maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">

    <!-- Favicon -->
    <link rel="icon" href="{% static 'icon.png' %}" type="image/x-icon" />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Lobster" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Righteous" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Fredoka+One" rel="stylesheet">

    <style>

        body{
            background: url("{% static 'bg.jpg' %}");
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .container-fluid{
            padding:50px;
        }

        .container{
            background-color:white;
            padding:50px;
            border-radius:10px;
        }

        #title{
            font-family: 'Fredoka One', cursive;
        }

        .text-uppercase{
            font-family: 'Righteous', cursive;
        }

        .style1{
            color:#FF0000;
            font-weight:bold;
        }

        .style4{
            color:#00FFFF;
            font-weight:bold;
        }

        .style5{
            font-family: 'Righteous', cursive;
            color:#FF0000;
            font-weight:bold;
        }

        .style6{
            color:#FF0000;
            font-weight:bold;
        }

        img{
            width:120px;
            height:120px;
            object-fit:cover;
            margin-bottom:20px;
        }

    </style>

</head>

<body>

<div class="container-fluid">

    <div>

        <h2 class="style6 text-center" id="title">
            Comparative Analysis of Liver diseases by using Machine Learning Techniques
        </h2>

        <p class="text-center">
            <span class="style1">
                <small id="passwordHelpInline" class="text-muted">
                    Liver Diseases, Machine Learning algorithms, Physicians, Patients.
                </small>
            </span>
        </p>

        <hr>

        <div class="row">

            <div class="col-md-5">
                <form role="form" method="POST">
                    {% csrf_token %}
                    <fieldset>
                        <p class="text-uppercase pull-center">&nbsp;</p>
                    </fieldset>
                </form>
            </div>

            <div class="col-md-2">
                <!-- Empty Space -->
            </div>

            <div class="col-md-5">

                <form method="POST" role="form">

                    {% csrf_token %}

                    <fieldset>

                        <img src="{% static 'Login.jpg' %}" alt="Login Image">

                        <p class="style5">
                            Login Using Your Account:
                        </p>

                        <div class="form-group">
                            <input type="text"
                                   name="username"
                                   placeholder="User Name"
                                   required>
                        </div>

                        <div class="form-group">
                            <input type="password"
                                   name="password"
                                   placeholder="Password"
                                   required>
                        </div>

                        <div>
                            <input type="submit"
                                   name="submit1"
                                   class="btn btn-md btn-primary"
                                   value="sign_in">
                        </div>

                        <br>

                        <p class="style5">
                            Login Using Your Account:
                        </p>

                        <div>

                            <button class="btn btn-lg btn-info">
                                <a href="{% url 'serviceproviderlogin' %}" style="color:white;text-decoration:none;">
                                    SERVICE PROVIDER
                                </a>
                            </button>

                            <button class="btn btn-lg btn-success">
                                <a href="{% url 'Register1' %}" style="color:white;text-decoration:none;">
                                    REGISTER
                                </a>
                            </button>

                        </div>

                    </fieldset>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>

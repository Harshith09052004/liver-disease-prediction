{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Liver Disease Prediction</title>

    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        body{
            font-family: 'Poppins', sans-serif;
            background: url("{% static 'bg.jpg' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .glass{
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.2);
        }

    </style>

</head>

<body class="min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-6xl grid md:grid-cols-2 rounded-3xl overflow-hidden shadow-2xl glass">

        <!-- Left Side -->
        <div class="hidden md:flex flex-col justify-center items-center bg-slate-900/70 p-12 text-white">

            <img src="{% static 'Login.jpg' %}"
                 class="w-64 mb-8 rounded-2xl shadow-2xl"
                 alt="AI Medical">

            <h1 class="text-5xl font-bold text-cyan-400 text-center leading-tight">
                AI-Based Liver Disease Prediction
            </h1>

            <p class="mt-6 text-slate-300 text-center text-lg leading-relaxed">
                Comparative Analysis of Liver Diseases using Machine Learning Techniques
            </p>

        </div>

        <!-- Right Side -->
        <div class="bg-white p-10 md:p-14 flex flex-col justify-center">

            <div class="mb-10">

                <h2 class="text-4xl font-bold text-slate-800">
                    Welcome Back 👋
                </h2>

                <p class="text-slate-500 mt-3">
                    Login to continue using the prediction platform
                </p>

            </div>

            <form method="POST" class="space-y-6">

                {% csrf_token %}

                <!-- Username -->
                <div>

                    <label class="block text-slate-700 font-medium mb-2">
                        Username
                    </label>

                    <input type="text"
                           name="username"
                           placeholder="Enter username"
                           required
                           class="w-full px-5 py-4 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-cyan-500">

                </div>

                <!-- Password -->
                <div>

                    <label class="block text-slate-700 font-medium mb-2">
                        Password
                    </label>

                    <input type="password"
                           name="password"
                           placeholder="Enter password"
                           required
                           class="w-full px-5 py-4 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-cyan-500">

                </div>

                <!-- Login Button -->
                <button type="submit"
                        name="submit1"
                        class="w-full bg-cyan-500 hover:bg-cyan-600 text-white py-4 rounded-xl text-lg font-semibold shadow-lg transition duration-300">

                    Sign In

                </button>

            </form>

            <!-- Actions -->
            <div class="mt-10 grid grid-cols-2 gap-4">

                <a href="{% url 'serviceproviderlogin' %}"
                   class="bg-slate-900 hover:bg-slate-800 text-white text-center py-4 rounded-xl font-semibold shadow-md transition">

                    Service Provider

                </a>

                <a href="{% url 'Register1' %}"
                   class="bg-emerald-500 hover:bg-emerald-600 text-white text-center py-4 rounded-xl font-semibold shadow-md transition">

                    Register

                </a>

            </div>

        </div>

    </div>

</body>

</html>

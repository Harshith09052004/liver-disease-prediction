{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | AI Liver Disease Prediction</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            min-height:100vh;
            background:url("{% static 'bg.jpg' %}") center center/cover no-repeat;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
        }

        .register-card{
            width:100%;
            max-width:1200px;
            background:rgba(255,255,255,0.96);
            border-radius:30px;
            overflow:hidden;
            box-shadow:0 15px 40px rgba(0,0,0,0.25);
        }

        .left-panel{
            background:linear-gradient(135deg,#334155,#1e293b);
            color:white;
            padding:60px 40px;
            text-align:center;
            height:100%;
        }

        .left-panel img{
            width:240px;
            border-radius:20px;
            margin-bottom:30px;
            box-shadow:0 10px 25px rgba(0,0,0,0.3);
        }

        .project-title{
            font-size:3rem;
            font-weight:800;
            color:#22d3ee;
            line-height:1.2;
        }

        .project-desc{
            margin-top:20px;
            font-size:18px;
            color:#cbd5e1;
        }

        .right-panel{
            padding:50px;
        }

        .right-panel h1{
            font-size:48px;
            font-weight:800;
            color:#1e293b;
        }

        .right-panel p{
            color:#64748b;
            margin-bottom:30px;
        }

        .form-control{
            height:55px;
            border-radius:14px;
            margin-bottom:15px;
        }

        .btn-register{
            width:100%;
            background:#10b981;
            color:white;
            border:none;
            height:55px;
            border-radius:14px;
            font-size:18px;
            font-weight:600;
        }

        .btn-register:hover{
            background:#059669;
        }

        .btn-login{
            width:100%;
            margin-top:15px;
            background:#0f172a;
            color:white;
            border:none;
            height:55px;
            border-radius:14px;
            text-decoration:none;
            display:flex;
            justify-content:center;
            align-items:center;
            font-weight:600;
        }

        .btn-login:hover{
            color:white;
            background:#020617;
        }

        @media(max-width:768px){
            .project-title{
                font-size:2rem;
            }

            .right-panel{
                padding:30px;
            }

            .right-panel h1{
                font-size:36px;
            }
        }
    </style>
</head>

<body>

<div class="register-card">
    <div class="row g-0">

        <!-- LEFT SIDE -->
        <div class="col-lg-6">
            <div class="left-panel">

                <img src="{% static 'Register.jpg' %}" alt="Register">

                <h2 class="project-title">
                    AI-Based Liver Disease Prediction
                </h2>

                <p class="project-desc">
                    Comparative Analysis of Liver Diseases using
                    Machine Learning Techniques
                </p>

            </div>
        </div>

        <!-- RIGHT SIDE -->
        <div class="col-lg-6">
            <div class="right-panel">

                <h1>Create Account</h1>

                <p>
                    Register to access the prediction platform
                </p>

                <form method="POST">
                    {% csrf_token %}

                    <input type="text" name="username"
                           class="form-control"
                           placeholder="Username" required>

                    <input type="email" name="email"
                           class="form-control"
                           placeholder="Email Address" required>

                    <input type="password" name="password"
                           class="form-control"
                           placeholder="Password" required>

                    <input type="number" name="phoneno"
                           class="form-control"
                           placeholder="Mobile Number" required>

                    <input type="text" name="country"
                           class="form-control"
                           placeholder="Country" required>

                    <input type="text" name="state"
                           class="form-control"
                           placeholder="State" required>

                    <input type="text" name="city"
                           class="form-control"
                           placeholder="City" required>

                    <button type="submit" class="btn-register">
                        Register
                    </button>

                    <a href="{% url 'login' %}" class="btn-login">
                        User Login
                    </a>

                </form>

            </div>
        </div>

    </div>
</div>

</body>
</html>

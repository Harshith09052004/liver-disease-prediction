{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Service Provider Login</title>

    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        body{
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #0f172a, #1e293b);
        }

    </style>

</head>

<body class="min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-5xl grid md:grid-cols-2 bg-white rounded-3xl overflow-hidden shadow-2xl">

        <!-- Left -->
        <div class="bg-cyan-500 text-white flex flex-col justify-center items-center p-12">

            <img src="{% static 'Login.jpg' %}"
                 class="w-60 rounded-2xl shadow-2xl mb-8"
                 alt="Provider">

            <h1 class="text-5xl font-bold text-center">
                Service Provider Portal
            </h1>

            <p class="mt-6 text-center text-lg text-cyan-100">
                AI-Based Liver Disease Prediction Dashboard
            </p>

        </div>

        <!-- Right -->
        <div class="p-12 flex flex-col justify-center">

            <h2 class="text-4xl font-bold text-slate-800 mb-2">
                Welcome Back 👋
            </h2>

            <p class="text-slate-500 mb-10">
                Login as Service Provider
            </p>

            <form method="POST" class="space-y-6">

                {% csrf_token %}

                <div>

                    <label class="block mb-2 text-slate-700 font-medium">
                        Username
                    </label>

                    <input type="text"
                           name="username"
                           required
                           placeholder="Enter username"
                           class="w-full px-5 py-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:outline-none">

                </div>

                <div>

                    <label class="block mb-2 text-slate-700 font-medium">
                        Password
                    </label>

                    <input type="password"
                           name="password"
                           required
                           placeholder="Enter password"
                           class="w-full px-5 py-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:outline-none">

                </div>

                <button type="submit"
                        class="w-full bg-cyan-500 hover:bg-cyan-600 text-white py-4 rounded-xl text-lg font-semibold shadow-lg transition">

                    Login

                </button>

            </form>

            <a href="{% url 'login' %}"
               class="mt-8 text-center text-cyan-600 hover:text-cyan-800 font-medium">

                ← Back to User Login

            </a>

        </div>

    </div>

</body>

</html>
